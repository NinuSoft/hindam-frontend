  <script>
    (function () {
      const FAVICON_VERSION = '1';
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
      const faviconUrl = isDark ? `/favicon-dark.png?v=${FAVICON_VERSION}` : `/favicon-light.png?v=${FAVICON_VERSION}`;
      const favicon = document.querySelector('link[rel="icon"]');
      if (favicon) favicon.setAttribute('href', faviconUrl);
      const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleIcon) appleIcon.setAttribute('href', faviconUrl);
    })();
  </script>
