  <link rel="icon" type="image/png" href="/favicon-light.png" />
  <link rel="apple-touch-icon" href="/favicon-light.png" />
  <script>
    (function () {
      const FAVICON_VERSION = '1';
      const savedTheme = localStorage.getItem('theme');
      // Default to light theme (only use dark if explicitly saved as dark)
      const isDark = savedTheme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
      // Inject body loading background style dynamically before body is parsed/painted
      const bgStyle = document.createElement('style');
      bgStyle.innerHTML = `body.hd-loading { background: ${isDark ? '#040813' : '#f5f7fa'} !important; }`;
      document.head.appendChild(bgStyle);

      const faviconUrl = isDark ? `/favicon-dark.png?v=${FAVICON_VERSION}` : `/favicon-light.png?v=${FAVICON_VERSION}`;
      const favicon = document.querySelector('link[rel="icon"]');
      if (favicon) favicon.setAttribute('href', faviconUrl);
      const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleIcon) appleIcon.setAttribute('href', faviconUrl);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..1000&display=swap" rel="stylesheet">

  <!-- Preload Intro Screen script to download in parallel while CSS blocks paint -->
  <link rel="preload" as="script" href="/intro.js" />

  <!-- Intro screen styles — loaded before any JS so overlay paints instantly -->
  <link rel="stylesheet" href="/intro.css">
</head>

<body class="hd-loading">

  <!-- Intro overlay — rendered at byte 0, before the React bundle loads -->
  <div id="hd-intro" role="dialog" aria-label="هندام جاري التحميل" aria-live="polite" style="display: none;">
    <div class="hd-glow hd-glow-1"></div>
    <div class="hd-glow hd-glow-2"></div>

    <div class="hd-stage">
      <!-- Logo + scan -->
      <div class="hd-logo-wrap" id="hd-logo-wrap">
        <div class="hd-bracket hd-tl"></div>
        <div class="hd-bracket hd-tr"></div>
        <div class="hd-bracket hd-bl"></div>
        <div class="hd-bracket hd-br"></div>
        <div id="hd-scan-glow"></div>
        <div id="hd-scan"></div>
        <img src="/logo_dark.webp" alt="هندام" class="hd-logo hd-logo-dark" />
        <img src="/logo_light.webp" alt="هندام" class="hd-logo hd-logo-light" />
      </div>

      <!-- Brand name -->
      <div class="hd-brand">
        <h1>هنـ<span>دام</span></h1>
        <p>تتبع طلبات الخياطة والغسيل</p>
      </div>

      <!-- Status -->
      <div id="hd-status">
        <span class="hd-dot hd-dot-idle" id="hd-dot"></span>
        <span id="hd-status-text">جاري التهيئة&hellip;</span>
      </div>

      <!-- Progress bar -->
      <div class="hd-bar-track">
        <div id="hd-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <!-- GitHub Pages SPA fallback decode (see public/404.html) — restores the
       real path before the router mounts -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <!-- React bundle (Vite module) -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Intro controller — runs synchronously after overlay HTML is parsed -->
  <script src="/intro.js"></script>
</body>

</html>
